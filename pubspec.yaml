name: project_3_wheel
description: "Project 3 Wheel - Liquid Glass Fleet Management & Financial Dashboard for Electric Rickshaws"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Cloud & Backend
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.2
  firebase_auth: ^4.19.4
  firebase_storage: ^11.7.4

  # Local Offline Storage & Sync
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
  shared_preferences: ^2.2.3

  # Hardware & Scanner
  mobile_scanner: ^5.1.1
  image_picker: ^1.1.1

  # Document Generation & Export
  pdf: ^3.10.8
  printing: ^5.13.0
  excel: ^4.0.3
  path_provider: ^2.1.3

  # Network & Utilities
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
